name: Build Skills Index

on:
  schedule:
    # Run twice daily: 6 AM and 6 PM UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'scripts/build_skills_index.py'
      - '.github/workflows/skills-index.yml'

permissions:
  contents: read
  actions: write   # to trigger deploy-site.yml on schedule

jobs:
  build-index:
    # Only run on the upstream repository, not on forks
    if: github.repository == 'NousResearch/hermes-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx==0.28.1 pyyaml==6.0.2

      - name: Build skills index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_skills_index.py

      - name: Upload index artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: skills-index
          path: website/static/api/skills-index.json
          retention-days: 7

  # Re-trigger the docs deploy so the refreshed index lands on the live site.
  # The deploy itself is owned by deploy-site.yml (which crawls and deploys
  # everything in one pipeline); we just kick it on a schedule.
  trigger-deploy:
    needs: build-index
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Site workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The installation GITHUB_TOKEN intermittently returns HTTP 403
        # "API rate limit exceeded" (secondary limit). A bare single call
        # fails the whole job, leaving the freshly built index undeployed
        # and the Skills Hub stale until the next cron — which trips the
        # freshness watchdog. Retry with backoff so a transient blip no
        # longer blocks the deploy.
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run deploy-site.yml --repo "${{ github.repository }}"; then
              echo "Triggered deploy-site.yml on attempt ${attempt}."
              exit 0
            fi
            wait=$((attempt * 15))
            echo "Attempt ${attempt} failed; retrying in ${wait}s..." >&2
            sleep "${wait}"
          done
          echo "Failed to trigger deploy-site.yml after 5 attempts." >&2
          exit 1
